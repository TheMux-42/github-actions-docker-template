name: Build & Push Docker Image

on:
  push:
    branches: [ "latest-stable", "dev" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables (safe + lowercase + tag/branch aware)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"

          # detect tag vs branch
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # lowercase safety
          TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')

          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Debug (optional but useful)
        run: |
          echo "Repo: $REPO"
          echo "Tag: $TAG"
          echo "Ref type: $GITHUB_REF_TYPE"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Image
        run: docker build -t ghcr.io/${{ env.REPO }}:${{ env.TAG }} .

      - name: Push Image
        run: docker push ghcr.io/${{ env.REPO }}:${{ env.TAG }}
